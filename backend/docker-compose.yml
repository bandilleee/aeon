version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: aeon-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aeon_identity
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/docker/init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aeon-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: aeon-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: Bandiillleee@gmail.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - aeon-network

  identity-api:
    build:
      context: .
      dockerfile: src/Services/Identity/Aeon.Identity.Api/Dockerfile
    container_name: aeon-identity-api
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__IdentityDb=Host=postgres;Port=5432;Database=aeon_identity;Username=postgres;Password=postgres
      - Jwt__Secret=YourSuperSecretKeyThatIsAtLeast32CharactersLong!
      - Jwt__Issuer=Aeon
      - Jwt__Audience=AeonApp
      - Email__Enabled=false
      - Recaptcha__Enabled=false
      - Cors__FrontendUrl=http://localhost:3000
    ports:
      - "5251:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - aeon-network

volumes:
  postgres_data:
  pgadmin_data:

networks:
  aeon-network:
    driver: bridge