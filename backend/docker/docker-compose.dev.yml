# Development compose - only infrastructure services
# Use this when developing locally with hot reload

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: aeon-postgres-dev
    environment:
      POSTGRES_USER: aeon
      POSTGRES_PASSWORD: aeon_dev
      POSTGRES_DB: aeon_dev
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aeon"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aeon-dev-network

  # Redis for caching/sessions
  redis:
    image: redis:7-alpine
    container_name: aeon-redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data
    networks:
      - aeon-dev-network

  # pgAdmin for database management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: aeon-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@aeon.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - aeon-dev-network

  # Mailhog for email testing
  mailhog:
    image: mailhog/mailhog:latest
    container_name: aeon-mailhog
    ports:
      - "1025:1025"  # SMTP server
      - "8025:8025"  # Web UI
    networks:
      - aeon-dev-network

volumes:
  postgres_dev_data:
  redis_dev_data:

networks:
  aeon-dev-network:
    driver: bridge
