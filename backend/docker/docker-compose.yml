services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: aeon-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aeon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aeon_secret}
      POSTGRES_DB: ${POSTGRES_DB:-aeon_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aeon}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aeon-network

  # Redis for caching/sessions
  redis:
    image: redis:7-alpine
    container_name: aeon-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aeon-network

  # Identity API Service
  identity-api:
    build:
      context: ../
      dockerfile: docker/services/identity/Dockerfile
    container_name: aeon-identity-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=${POSTGRES_DB:-aeon_db};Username=${POSTGRES_USER:-aeon};Password=${POSTGRES_PASSWORD:-aeon_secret}
      - Jwt__Secret=${JWT_SECRET:-your-super-secret-key-min-32-chars-long}
      - Jwt__Issuer=${JWT_ISSUER:-aeon-identity}
      - Jwt__Audience=${JWT_AUDIENCE:-aeon-app}
      - Redis__ConnectionString=redis:6379
    ports:
      - "7039:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - aeon-network

  # Frontend
  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    container_name: aeon-frontend
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:7039
    ports:
      - "3000:3000"
    depends_on:
      - identity-api
    networks:
      - aeon-network

volumes:
  postgres_data:
  redis_data:

networks:
  aeon-network:
    driver: bridge
